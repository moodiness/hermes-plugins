name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Resolve plugin root
        shell: bash
        run: |
          if [ -f plugins/hermes-omp/pyproject.toml ]; then
            echo "PLUGIN_ROOT=plugins/hermes-omp" >> "$GITHUB_ENV"
          else
            echo "PLUGIN_ROOT=." >> "$GITHUB_ENV"
          fi
      - run: python -m pip install --upgrade 'pip>=21.3'
      - run: python -m pip install -e "${PLUGIN_ROOT}[dev]"
      - run: python -m pytest -q "${PLUGIN_ROOT}/tests"
      - run: python -m build "${PLUGIN_ROOT}"
