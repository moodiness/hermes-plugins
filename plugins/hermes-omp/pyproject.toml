[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hermes-omp"
version = "0.2.0rc1"
description = "Durable OMP supervision for Hermes Agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Hermes OMP contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
hermes-omp = "hermes_omp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_omp"]

[tool.hatch.build.targets.sdist]
include = ["src", "plugin", "skills", "docs", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hermes-plugins]
plugin-path = "plugin"
package-root = "."
manifest = "plugin/plugin.yaml"
