name: plugins

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: plugins
        shell: bash
        run: echo "matrix=$(python scripts/plugin_matrix.py)" >> "$GITHUB_OUTPUT"

  policy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install policy test dependencies
        run: python -m pip install --requirement requirements-policy.txt
      - name: Audit policy dependencies
        run: python -m pip install 'pip-audit==2.9.0' && python -m pip_audit --requirement requirements-policy.txt
      - name: Validate repository policy
        run: python -m pytest -q tests

  verify:
    needs: discover
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/pyproject.toml
      - run: python -m pip install --upgrade 'pip==25.2'
      - run: python -m pip install -e "${{ matrix.path }}[dev]"
      - name: Run plugin tests
        run: python -m pytest -q "${{ matrix.path }}/tests"
        env:
          MSYS_NO_PATHCONV: "1"
      - shell: bash
        run: cd "${{ matrix.path }}" && python -m pip install -r requirements-build.txt && SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- .)" sh scripts/build-release.sh
      - name: Install Hermes plugin validator
        if: matrix.python != '3.10'
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout 30b83ab7b1f194503de9f5545d88c81c4db91e3f
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
      - name: Validate plugin with Hermes
        if: matrix.python != '3.10'
        run: hermes plugins doctor "${{ matrix.plugin_path }}" --ci
