name: plugins

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: plugins
        shell: bash
        run: echo "matrix=$(python scripts/plugin_matrix.py)" >> "$GITHUB_OUTPUT"

  verify:
    needs: discover
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=21.3'
      - run: python -m pip install -e "${{ matrix.path }}[dev]"
      - run: python -m pytest -q "${{ matrix.path }}/tests"
      - run: python -m build "${{ matrix.path }}"
      - run: hermes plugins doctor "${{ matrix.plugin_path }}" --ci
